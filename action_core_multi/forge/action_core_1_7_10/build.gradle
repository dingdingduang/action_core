plugins {
    id 'java-library'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.4'
}
version = mod_version
group = 'com.whatever.actioncore'
base { archivesName = 'actioncore-1.7.10-forge' }
java { toolchain.languageVersion = JavaLanguageVersion.of(8); withSourcesJar() }
apply from: '../../../gradle/legacy-java8.gradle'
minecraft { mcVersion.set('1.7.10') }
processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') { expand version: project.version, mod_id: 'actioncore', minecraft_version: '1.7.10', mcversion: '1.7.10' }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

project.ext.nativeLibraries = file('../../..').canonicalFile
apply from: '../../../gradle/legacy-rfg-natives.gradle'
